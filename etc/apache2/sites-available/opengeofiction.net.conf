# OpenGeofiction site and API - the openstreetmap-website Rails port under
# Passenger, with the map, element and changeset upload/download calls handed
# to CGIMap over its Unix socket. Modelled on OSMF's apache.frontend.erb.
#
# Apache listens on 127.0.0.1:8081 only (8080 is CrowdSec's local API); nginx
# terminates TLS in front and
# is the only client (etc/nginx). RemoteIP trusts it alone, so REMOTE_ADDR,
# %h in the log and every bot rule see the real client. There is no TLS
# twin of this file and no HTTPS redirect here - both are nginx's.

# request duration appended, for the CrowdSec parser
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" combined_ms

<VirtualHost 127.0.0.1:8081>
    ServerName opengeofiction.net
    # api.ogf is the VPN name, served as the site. The site has one public
    # name: www. and api4. are gone from DNS
    ServerAlias api.ogf
    ServerAdmin sysadmin@opengeofiction.net
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1

    ErrorLog /var/www/html/opengeofiction.net/log/error.log
    CustomLog /var/www/html/opengeofiction.net/log/access.log combined_ms

    # Remove Proxy request header to mitigate https://httpoxy.org/
    RequestHeader unset Proxy early

    RewriteEngine on
    # known editor IPs, regenerated hourly by ogfutil-editorIpAllowlist. A txt
    # map is read at startup: full restart, not reload, the first time
    RewriteMap editor-ips txt:/etc/apache2/editor-ips.txt
    Include /etc/apache2/ogf-bot-rules.conf

    # Block attempts to access old API versions
    RewriteRule ^/api/0.[12345]/ - [G,L]

    # RFC 8414 OAuth 2 server metadata. JOSM reads it to find the authorize and
    # token endpoints for a non-openstreetmap.org API URL; without it JOSM
    # guesses <api>/token and <api>/authorize, which do not exist. Rails does
    # not serve it (that needs OpenID Connect), so a static file does, written
    # by the guide's OAuth section
    Alias /.well-known/oauth-authorization-server /etc/opengeofiction/oauth-authorization-server.json
    <Files oauth-authorization-server.json>
        ForceType application/json
        Require all granted
    </Files>

    # Rails
    DocumentRoot /var/www/html/opengeofiction.net/public
    RailsEnv production
    PassengerAppGroupName ogf-rails
    # SetEnv SECRET_KEY_BASE ... - the same secret rails-jobs@.service reads
    # from /etc/opengeofiction/rails.env, in Apache syntax
    Include /etc/opengeofiction/rails-apache.conf
    Alias /favicon.ico /var/www/html/opengeofiction.net/app/assets/favicons/favicon.ico

    # Pass authentication related headers to cgimap
    <Location />
        CGIPassAuth On
    </Location>

    # Normalise Accept-Encoding headers to workaround cgimap bug
    RequestHeader edit* Accept-Encoding "\s*,\s*" ", "

    # Pass supported calls to cgimap
    RewriteRule ^/api/0\.6/map(\.json|\.xml)?$ unix:/run/cgimap/socket|fcgi://127.0.0.1$0 [P]
    RewriteCond %{REQUEST_METHOD} ^(HEAD|GET)$
    RewriteRule ^/api/0\.6/(node|way|relation)/[0-9]+(\.json|\.xml)?$ unix:/run/cgimap/socket|fcgi://127.0.0.1$0 [P]
    RewriteRule ^/api/0\.6/(node|way|relation)/[0-9]+/history(\.json|\.xml)?$ unix:/run/cgimap/socket|fcgi://127.0.0.1$0 [P]
    RewriteRule ^/api/0\.6/(node|way|relation)/[0-9]+/relations(\.json|\.xml)?$ unix:/run/cgimap/socket|fcgi://127.0.0.1$0 [P]
    RewriteRule ^/api/0\.6/node/[0-9]+/ways(\.json|\.xml)?$ unix:/run/cgimap/socket|fcgi://127.0.0.1$0 [P]
    RewriteRule ^/api/0\.6/(way|relation)/[0-9]+/full(\.json|\.xml)?$ unix:/run/cgimap/socket|fcgi://127.0.0.1$0 [P]
    RewriteCond %{REQUEST_METHOD} ^(HEAD|GET)$
    RewriteRule ^/api/0\.6/(nodes|ways|relations)(\.json|\.xml)?$ unix:/run/cgimap/socket|fcgi://127.0.0.1$0 [P]
    # Interim: a changeset upload authenticated with a password goes to Rails,
    # which still checks passwords (ogf branch, basic_auth_support); CGIMap
    # only knows bearer tokens and would treat it as anonymous. Reads are
    # anonymous on CGIMap whatever header they carry, so only upload moves
    RewriteCond %{HTTP:Authorization} !^Basic [NC]
    RewriteRule ^/api/0\.6/changeset/[0-9]+/(upload|download)(\.json|\.xml)?$ unix:/run/cgimap/socket|fcgi://127.0.0.1$0 [P]

    # Fingerprinted assets: cache for a year
    <Location /assets/>
        Header unset Last-Modified
        FileETag Size
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "immutable, max-age=31536000" "expr=%{REQUEST_STATUS} == 200"
    </Location>
    <Location /attachments/>
        Header unset ETag
        FileETag None
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </Location>
    <Location /export/embed.html>
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
        Header always set Referrer-Policy "no-referrer-when-downgrade"
    </Location>

    # The old wiki lived here
    RedirectPermanent /wiki/ https://wiki.opengeofiction.net/

    <Directory /var/www/html/opengeofiction.net/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # serve the precompiled .br / .gz asset variants directly
        RewriteCond "%{HTTP:Accept-encoding}" "br"
        RewriteCond "%{REQUEST_FILENAME}\.br" -s
        RewriteRule "^(.*)\.(css|ico|js|json|svg|xml)$" "$1\.$2\.br" [QSA]
        RewriteCond "%{HTTP:Accept-encoding}" "gzip"
        RewriteCond "%{REQUEST_FILENAME}\.gz" -s
        RewriteRule "^(.*)\.(css|ico|js|json|svg|xml)$" "$1\.$2\.gz" [QSA]
        RewriteRule "\.css\.(br|gz)$" "-" [T=text/css,E=no-gzip:1,E=no-brotli:1]
        RewriteRule "\.ico\.(br|gz)$" "-" [T=image/vnd.microsoft.icon,E=no-gzip:1,E=no-brotli:1]
        RewriteRule "\.js\.(br|gz)$" "-" [T=text/javascript,E=no-gzip:1,E=no-brotli:1]
        RewriteRule "\.json\.(br|gz)$" "-" [T=application/json,E=no-gzip:1,E=no-brotli:1]
        RewriteRule "\.svg\.(br|gz)$" "-" [T=image/svg+xml,E=no-gzip:1,E=no-brotli:1]
        RewriteRule "\.xml\.(br|gz)$" "-" [T=application/xml,E=no-gzip:1,E=no-brotli:1]
        <FilesMatch "\.(css|js|json|svg|xml)\.br$">
            Header set Content-Encoding br
        </FilesMatch>
        <FilesMatch "\.(css|js|json|svg|xml)\.gz$">
            Header set Content-Encoding gzip
        </FilesMatch>
    </Directory>
</VirtualHost>
