# OpenGeofiction bot mitigation rules, Include'd by the opengeofiction.net
# vhost. This file is the source of truth; the reasoning behind each rule is
# in its comment and in this repository's history (the wiki page that used to
# carry them, Admin:Production setup/Apache rules, was retired 2026-09-20).
#
# The pattern: crawlers wear Chrome/Safari user agents but give themselves
# away - no referer or a synthetic one, stale or rounded Chrome versions,
# Windows NT 11.0, rotating agents. Rules key on those tells, scoped to the
# element pages they scrape, and never on "AppleWebKit without referer"
# alone, which blocked every bookmark and pasted link (March 2026).
#
# Maintenance: bump the stale Chrome ceiling (<=136 below) every few months,
# and the current-stable band exclusion (15[1-6]) quarterly - each new stable
# ships .0.0.0 and leaks through the rounded-version rule until it is added.
# Check the Chrome release blog. Verify a change with a forged client at
# Apache: curl -sI -H 'Host: opengeofiction.net' -H 'X-Forwarded-For: 203.0.113.9'
# -A '<UA>' http://127.0.0.1:8081/way/1
# Requires: RewriteEngine on, and RewriteMap editor-ips (both in the vhost).
#
# Every block carries E=nokeepalive:1, so the 403 goes out with
# Connection: close and the worker is released at once rather than held for
# KeepAliveTimeout (measured 2026-09-14: 5.0 s per block, for a 0.1 ms reply).

# www.opengeofiction.net is not in DNS and serves nothing, so a www referer is
# always bot-fabricated (the 2026-09-14 crawl kept its spoofed referer when it
# moved to the bare host). All-path block
RewriteCond %{HTTP_REFERER} ^https?://www\.opengeofiction\.net(:[0-9]+)?(/|$) [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Element pages: block bare OGF root-URL referer (synthetic referer bypass).
# 10.33.7.* exempt - OGF-Patrol sends https://opengeofiction.net/ as referer
RewriteCond %{REMOTE_ADDR} !^10\.33\.7\. [NC]
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} ^https?://(www\.)?opengeofiction\.net/?$ [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Element pages: block bare Google homepage referer (synthetic referer bypass)
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} ^https?://(www\.)?google\.com/?$ [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Synthetic search-engine .net referers - real search engines use .com; the
# .net variants are always bot-fabricated. All-path block: zero FP risk
RewriteCond %{HTTP_REFERER} ^https?://(www\.)?(bing|baidu|yandex|yahoo|google)\.net/?$ [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Element pages: block stale Chrome (<=136) without referer. Edge excluded;
# known editor IPs excluded via the RewriteMap
RewriteCond ${editor-ips:%{REMOTE_ADDR}|NOTFOUND} =NOTFOUND
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} !. [NC]
RewriteCond %{HTTP_USER_AGENT} AppleWebKit/537\.36 [NC]
RewriteCond %{HTTP_USER_AGENT} Chrome/(([1-9]?[0-9]|1[0-2][0-9]|13[0-6])\.0) [NC]
RewriteCond %{HTTP_USER_AGENT} !Edg/ [NC]
RewriteCond %{HTTP_USER_AGENT} !Edge/ [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Element pages: block rounded Chrome version (X.0.0.0, which real Chrome
# stable also sends)
# without referer. Edge excluded; the current stable band excluded (bump
# quarterly); known editor IPs excluded via the RewriteMap
RewriteCond ${editor-ips:%{REMOTE_ADDR}|NOTFOUND} =NOTFOUND
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} !. [NC]
RewriteCond %{HTTP_USER_AGENT} AppleWebKit/537\.36 [NC]
RewriteCond %{HTTP_USER_AGENT} Chrome/[0-9]+\.0\.0\.0 [NC]
RewriteCond %{HTTP_USER_AGENT} !Chrome/(15[1-6])\.0\.0\.0 [NC]
RewriteCond %{HTTP_USER_AGENT} !Edg/ [NC]
RewriteCond %{HTTP_USER_AGENT} !Edge/ [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Element pages: block the distributed crawl using fake rounded Chrome 142-145
# UAs WITH a referer (2026-09-14). The rounded rule above requires no referer,
# so a crawler sending one (the previous www element page) got full renders:
# 145,843 requests from 123,506 IPs in ten hours, the same eight fake desktop
# UAs as the 2026-09-10 wiki flood. Deliberately narrow - on element pages every
# 142-145 request was one of the eight or the Meta crawler, none real, none
# Mobile. The UA cannot exclude Edge - two of the eight fake an Edg/ token - but
# Sec-CH-UA can: a real Edge names itself in the brands, the fake sets are
# Chrome-only. The CH condition below admits settled Edge (142-145 included,
# which this rule had been blocking for real users) and keeps every fake that
# carries an Edg/ token. An Edge without CH (pre-89, or plain HTTP where CH is
# not sent) is still blocked here, which is the same outcome as the UA-only
# exclusion it replaces: real Edge 142-145 over HTTPS always sends CH.
# !Mobile protects Android Chrome, which rounds by design. Widen the band if
# the crawl moves, rather than adding per-version exclusions
RewriteCond ${editor-ips:%{REMOTE_ADDR}|NOTFOUND} =NOTFOUND
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_USER_AGENT} AppleWebKit/537\.36 [NC]
RewriteCond %{HTTP_USER_AGENT} Chrome/1(4[2-5])\.0\.0\.0 [NC]
RewriteCond %{HTTP_USER_AGENT} !Mobile [NC]
RewriteCond %{HTTP:Sec-CH-UA} !Microsoft [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# --- Header-consistency rules, deployed 2026-10-26 --------------------------
# A client-asserted header is not identity, but a header set that contradicts
# itself cannot come from a real browser. Measured on element pages over five
# days and 783,569 requests (reports/2026-10-26-turbo-probe-review.md): the
# referer-carrying crawl was served 216,887 requests in its peak day and sent
# both contradictions below; real sessions sent neither.

# 1) OGF referer with Sec-Fetch-Site none or cross-site. A browser computes
# same-origin for a same-host referer (the wiki is same-site), and `none` means
# a typed URL or bookmark, which carries no referer at all. 66% of the crawl's
# served requests did this; 0 of 2,330 real turbo-frame requests did.
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} ^https?://(www\.)?opengeofiction\.net(/|$) [NC]
RewriteCond %{HTTP:Sec-Fetch-Site} ^(none|cross-site)$ [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# 2) A UA whose Sec-CH-UA contradicts it. Real Chrome/Edge agreed in 1,657 of
# 1,658 real turbo-frame and wiki-referred sessions; the crawl disagreed in 88%
# of Chrome UAs and sent Edge UAs with a Chrome-only brand set. An ABSENT CH is
# not a block (old browsers, non-Chromium UAs) - only a present, disagreeing
# one. Opera excluded: it sends an "Opera GX" brand and compares differently.
SetEnvIf User-Agent "Chrome/([0-9]+)\." ogfx_ua_major=$1
SetEnvIf User-Agent "Edg[A-Za-z]*/([0-9]+)\." ogfx_ua_major=$1
SetEnvIf User-Agent "OPR/" ogfx_opera=1
SetEnvIf Sec-CH-UA "\"(?:Google Chrome|Chromium|Microsoft Edge)\";v=\"([0-9]+)\"" ogfx_ch_major=$1
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond expr "env('ogfx_ua_major') != '' && env('ogfx_ch_major') != '' && env('ogfx_ua_major') != env('ogfx_ch_major') && env('ogfx_opera') == ''"
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Element pages: block fake Windows NT 11.0 without referer
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} !. [NC]
RewriteCond %{HTTP_USER_AGENT} Windows\ NT\ 11\.0 [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Diary edit/hide actions without an OGF referer
RewriteCond %{REQUEST_URI} ^/user/.+/diary/(comments|\d+/(edit|hide|hidecomment/\d+))$ [NC]
RewriteCond %{HTTP_REFERER} !^https?://(www\.|wiki\.)?opengeofiction\.net [NC]
RewriteCond %{HTTP_USER_AGENT} AppleWebKit/(537\.36|605\.1\.15) [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# API scraping with browser-like UA and an off-site referer. The referer test
# also matches a MISSING referer, so this rule additionally blocks third-party
# browser tools that strip it: osm-simple3d-editor sets a page-wide
# <meta name="referrer" content="no-referrer"> to load the OGF vector basemap
# sprite (ogfvector.infinatio.us 403s that sprite to a foreign referer), and
# because AppleWebKit is in every Chrome/Safari/Edge UA such tools then work in
# Firefox only. Known editor IPs are exempt, as in the rules above: an editor's
# own tool is not the scrape traffic this targets. Harmless on the
# HTTP vhost, where /api/ would only be redirected to HTTPS anyway
RewriteCond ${editor-ips:%{REMOTE_ADDR}|NOTFOUND} =NOTFOUND
RewriteCond %{REQUEST_URI} ^/api/0\.6/ [NC]
RewriteCond %{HTTP_REFERER} !^https?://(www\.|wiki\.)?opengeofiction\.net [NC]
RewriteCond %{HTTP_USER_AGENT} AppleWebKit/(537\.36|605\.1\.15) [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Legacy wiki paths (wiki is on wiki.opengeofiction.net)
RewriteCond %{REQUEST_URI} ^/wiki.+ [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Meta link-preview crawler
RewriteCond %{HTTP_USER_AGENT} meta-externalagent [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]

# Element page views without referer: block (distributed scraper farm).
# Exceptions: internal VPN, known editor IPs (RewriteMap)
RewriteCond ${editor-ips:%{REMOTE_ADDR}|NOTFOUND} =NOTFOUND
RewriteCond %{REMOTE_ADDR} !^10\.33\.7\. [NC]
RewriteCond %{REQUEST_URI} ^/(node|way|relation|changeset)/[0-9]+(/history)?$ [NC]
RewriteCond %{HTTP_REFERER} !. [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]
