# Tile request rate limit for the public tile server (tiles04).
#
# QS_ClientEventLimitCount is per source address and global-context only: it
# cannot be declared inside <VirtualHost>. A full restart is required to add or
# remove it; mod_qos refuses the change on a graceful reload.
#
# The event variable must be set with mod_setenvif's SetEnvIf. mod_qos's own
# QS_SetEnvIf silently fails to set it in 11.76, which makes the rule look
# broken.
#
# 4,000 requests / 600 s. The bulk QGIS client measured in October 2026 ran at
# 2,856 req/min (peak 5,957), while the 99th percentile of every other client
# minute was 601 and the heaviest legitimate IP-minute was 2,083. The limit
# caps a bulk download at ~400/min and leaves legitimate bursts intact.
#
# Violation lines go to the vhost ErrorLog. qos:crit silences the per-request
# line; count the 429s in the access log instead.

QS_ClientEntries 50000

SetEnvIf Request_URI "^/(ogf-carto|ttopo|osmcarto|ogf-topo)/" QS_Tile
QS_ClientEventLimitCount 4000 600 QS_Tile

QS_ErrorResponseCode 429
QS_ErrorPage /blocked-tile.png

LogLevel warn qos:crit

<Location /blocked-tile.png>
    Header always set Content-Type "image/png"
    Header always set Cache-Control "no-store"
    Header always set Access-Control-Allow-Origin "*"
    Header always set Retry-After "600"
    Header always set X-Blocked "rate limit: tile.opengeofiction.net"
</Location>
