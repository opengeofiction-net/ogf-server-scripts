# Passenger settings for the OpenGeofiction Rails port. Enabled with
# a2enconf ogf-passenger; the vhost only names the DocumentRoot and RailsEnv.
<IfModule mod_passenger.c>
    # Debian's apache2.service has PrivateTmp, so the default registry under
    # /tmp becomes /tmp/systemd-private-*/tmp/... and the socket paths inside
    # it exceed the 108-byte Unix socket limit - passenger-status then fails.
    # A fixed directory outside /tmp, created by tmpfiles.d; the admin tools
    # need PASSENGER_INSTANCE_REGISTRY_DIR pointing at it
    PassengerInstanceRegistryDir /run/passenger-instreg
    PassengerDefaultRuby /usr/bin/ruby
    PassengerPreloadBundler on
    # ceiling on Rails processes, each ~300 MB warm - 6 on an 8 GB server
    PassengerMaxPoolSize 6
    PassengerMinInstances 2
    PassengerPoolIdleTime 3600
    PassengerMaxRequests 5000
    PassengerMaxRequestQueueSize 100
    PassengerFriendlyErrorPages off
    PassengerDisableSecurityUpdateCheck on
    PassengerDisableAnonymousTelemetry on
    # server-level only, so it lives here and not in the vhost
    PassengerPreStart https://opengeofiction.net/
</IfModule>
