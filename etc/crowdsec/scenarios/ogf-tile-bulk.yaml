# Bulk tile download on the public tile server.
#
# CrowdSec leaky buckets hold up to <capacity> events and leak ONE event per
# <leakspeed>; the allowed sustained rate is therefore capacity/leakspeed.
# 20,000 events with a 100 ms leak = a 20,000-request burst allowance and a
# sustained rate of 10 requests/s (600/min).
#
# That is well above legitimate use: measured 2026-10-26/27, the heaviest
# legitimate clients (JOSM prefetching, iD panning) peaked at ~3,000 requests
# in 10 minutes (2,000 in their worst 10-minute window), while the bulk QGIS
# client ran at 260,000 per 10 minutes (433/s) and fills the bucket in under a
# minute.
#
# Do NOT use a small capacity with a long leakspeed (the first version used
# 8000/10m): that leaks one event per 10 minutes, so the bucket accumulates
# over hours and any heavy editor eventually trips it. That version banned
# three legitimate editors on 2026-10-27 before it was corrected.
#
# Private/RFC1918 sources are whitelisted by crowdsecurity/whitelists, so a
# VPN test address will never trigger this - test from a public address, or
# verify the match with `cscli explain`.
type: leaky
name: ogf/tile-bulk
description: "Bulk tile download: sustained >10 tile requests/s or a >20k burst from one source"
filter: "evt.Meta.log_type == 'http_access-log' && evt.Meta.service == 'http' && evt.Meta.http_path contains '.png'"
groupby: evt.Meta.source_ip
capacity: 20000
leakspeed: 100ms
blackhole: 10m
labels:
  service: http
  type: tile-bulk
  remediation: true
