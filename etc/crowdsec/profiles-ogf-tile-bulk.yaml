# Profile for the ogf/tile-bulk scenario: 12 h ban instead of the default 4 h.
# /etc/crowdsec/profiles.yaml is a multi-document YAML file - prepend this
# block followed by a line containing only '---', then reload crowdsec.
name: ogf_tile_bulk
filters:
 - Alert.Remediation == true && Alert.GetScope() == "Ip" && Alert.GetScenario() in ["ogf/tile-bulk"]
decisions:
 - type: ban
   duration: 12h
on_success: break
