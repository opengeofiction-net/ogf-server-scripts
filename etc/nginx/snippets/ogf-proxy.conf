# Hand the request to Apache. X-Forwarded-For carries only our own view of
# the client, never a client-supplied chain: Apache's mod_remoteip trusts
# 127.0.0.1 alone and every bot rule keys on the result.
proxy_pass http://ogf-apache;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# map calls and changeset uploads take their time; requests are buffered
# so Apache only ever sees a complete one, responses are streamed
proxy_read_timeout 300s;
proxy_send_timeout 60s;
proxy_buffering off;
