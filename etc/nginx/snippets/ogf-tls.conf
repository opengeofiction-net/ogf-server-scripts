# One certificate for every name, requested with certbot certonly --webroot
# (guide, Front proxy section); renewal answers on the :80 blocks' acme location
ssl_certificate /etc/letsencrypt/live/opengeofiction.net/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/opengeofiction.net/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
http2 on;
