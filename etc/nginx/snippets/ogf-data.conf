# The data.opengeofiction.net tree: planet backups, the minutely replication
# feed, the utility server's outputs, extracts. Served here and never by
# Apache, so the machine clients that follow the feed cannot be starved by
# the site (2026-09-14). Symlinks in the tree are followed.
root /var/www/html/data.opengeofiction.net/public_html;
access_log /var/www/html/data.opengeofiction.net/logs/access.log combined_ms;
autoindex on;
autoindex_exact_size off;
sendfile on;
tcp_nopush on;
# the feed and the backups are fetched cross-origin by the tools
add_header Access-Control-Allow-Origin "*" always;

# The data drop's API (danu #190): Danu's square uploads, answered by
# danu-drop on the utility server, over the VPN. nginx takes an upload whole
# before passing it on, so a mapper on a slow line holds an nginx buffer, not
# one of gunicorn's few workers; the drop reads the largest square through
# in seconds before answering, hence the read timeout. The body limit is
# conf.d/ogf.conf's 64m, which is the drop's own. The address is util's, not
# its name: nginx resolves a name once, at start, and util.ogf is the VPN's.
location /dem/api/ {
    proxy_pass http://10.33.7.22:8337/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
    proxy_read_timeout 300s;
}

# replication state changes every minute - never cache it
location ~ ^/replication/.*state\.txt$ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Access-Control-Allow-Origin "*" always;
}
