# The data.opengeofiction.net tree: planet backups, the minutely replication
# feed, the utility server's outputs, extracts. Served here and never by
# Apache, so the machine clients that follow the feed cannot be starved by
# the site (2026-09-14). Symlinks in the tree are followed.
root /var/www/html/data.opengeofiction.net/public_html;
access_log /var/www/html/data.opengeofiction.net/logs/access.log combined_ms;
autoindex on;
autoindex_exact_size off;
sendfile on;
tcp_nopush on;
# the feed and the backups are fetched cross-origin by the tools
add_header Access-Control-Allow-Origin "*" always;

# replication state changes every minute - never cache it
location ~ ^/replication/.*state\.txt$ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Access-Control-Allow-Origin "*" always;
}
