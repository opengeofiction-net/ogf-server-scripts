# OpenGeofiction: nginx terminates TLS and owns every connection; anything
# with a request in it goes to Apache on 127.0.0.1:8081 (Passenger, CGIMap,
# the bot rules). A client that completes TCP and TLS and then sends nothing
# costs one worker a few hundred bytes until client_header_timeout, and never
# an Apache thread - the 2026-09-14 connection-stall flood pinned all 150 of
# the old server's prefork children that way. In the http module the TLS
# handshake is bounded by client_header_timeout too; there is no separate
# handshake timeout to set. server_tokens and keepalive_timeout are not here:
# Debian's nginx.conf sets both in its http block and a repeat at the same
# level is an error - the guide seds keepalive_timeout there.
client_header_timeout 5s;
client_body_timeout 10s;
send_timeout 30s;
reset_timedout_connection on;
# changeset uploads and note bodies; GPX traces are disabled
client_max_body_size 64m;

# Apache's combined_ms with the request time in seconds rather than microseconds
log_format combined_ms '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

# Per-response rate cap for the data tree (used by snippets/ogf-data.conf).
# 0 means unlimited. The VPN hosts are all on 10.33.7.0/24: the tile servers,
# the utility host and the replicas pull extracts, DEM tiles and the planet
# file over it and must run at line rate.
map $remote_addr $ogf_data_limit_rate {
    default        5m;
    ~^10\.33\.7\.  0;
    127.0.0.1      0;
    ::1            0;
}

upstream ogf-apache {
    server 127.0.0.1:8081;
    keepalive 32;
}
